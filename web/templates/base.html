<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}Sticker Workflow{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    :root {
      --brand: #4f46e5;
      --brand-light: #ede9fe;
    }
    body { background: #f8f9fa; font-family: 'Segoe UI', sans-serif; }

    /* Navbar */
    .navbar { background: var(--brand) !important; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; color: #fff !important; }
    .navbar .nav-link { color: rgba(255,255,255,.85) !important; }
    .navbar .nav-link:hover { color: #fff !important; }

    /* Kanban column */
    .kanban-col {
      min-width: 240px; max-width: 260px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .kanban-header {
      border-radius: 12px 12px 0 0;
      padding: 10px 14px;
      font-weight: 600;
      font-size: .85rem;
      color: #fff;
    }
    .kanban-body { padding: 8px; min-height: 120px; }

    /* Order card */
    .order-card {
      background: #fff;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: box-shadow .15s, transform .1s;
    }
    .order-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.12); transform: translateY(-1px); }
    .order-card.urgent { border-left: 3px solid #dc3545; }

    /* Progress stages */
    .stage-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 20px;
      font-size: .78rem; font-weight: 600;
      background: var(--brand-light); color: var(--brand);
    }

    /* Search bar */
    .search-box { max-width: 400px; }
    .search-box .form-control { border-radius: 20px 0 0 20px; }
    .search-box .btn { border-radius: 0 20px 20px 0; background: var(--brand); border-color: var(--brand); }

    /* Stat cards */
    .stat-card { border-radius: 12px; border: none; }

    /* History timeline */
    .timeline { border-left: 2px solid #dee2e6; padding-left: 16px; }
    .timeline-item { position: relative; margin-bottom: 12px; }
    .timeline-item::before {
      content: ''; position: absolute; left: -21px; top: 6px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--brand);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-lg mb-4">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/"><i class="bi bi-layers me-2"></i>Sticker Workflow</a>
    <div class="navbar-nav ms-auto flex-row gap-3">
      <a class="nav-link" href="/"><i class="bi bi-kanban me-1"></i>Tableau de bord</a>
      <a class="nav-link" href="/order/new"><i class="bi bi-plus-circle me-1"></i>Nouvelle commande</a>
    </div>
  </div>
</nav>

<div class="container-fluid px-4">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
