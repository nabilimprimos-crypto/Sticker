{% extends "base.html" %}
{% block title %}Nouvelle commande — Sticker Workflow{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-4"><i class="bi bi-plus-circle me-2"></i>Nouvelle commande</h5>
        <form method="post">

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Référence</label>
              <input type="text" name="reference" class="form-control" value="{{ ref }}"
                     placeholder="Auto-générée si vide"/>
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Date de livraison souhaitée</label>
              <input type="date" name="date_deadline" class="form-control"/>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Client <span class="text-danger">*</span></label>
            <input type="text" name="client" class="form-control" required placeholder="Nom du client"/>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-8">
              <label class="form-label fw-semibold">Désignation sticker <span class="text-danger">*</span></label>
              <input type="text" name="product" class="form-control" required placeholder="Ex: Sticker logo rond"/>
            </div>
            <div class="col-sm-4">
              <label class="form-label fw-semibold">Quantité</label>
              <input type="number" name="quantity" class="form-control" value="1" min="1" required/>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Largeur (mm)</label>
              <input type="number" name="width_mm" class="form-control" placeholder="0" step="0.1"/>
            </div>
            <div class="col-sm-6">
              <label class="form-label fw-semibold">Hauteur (mm)</label>
              <input type="number" name="height_mm" class="form-control" placeholder="0" step="0.1"/>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-4">
              <label class="form-label fw-semibold">Matière</label>
              <select name="material" class="form-select">
                <option value="vinyl">Vinyle</option>
                <option value="paper">Papier</option>
                <option value="polyester">Polyester</option>
                <option value="transparent">Transparent</option>
              </select>
            </div>
            <div class="col-sm-4">
              <label class="form-label fw-semibold">Finition</label>
              <select name="finish" class="form-select">
                <option value="glossy">Brillant</option>
                <option value="matte">Mat</option>
                <option value="uv">Vernis UV</option>
              </select>
            </div>
            <div class="col-sm-4">
              <label class="form-label fw-semibold">Découpe</label>
              <select name="cut_type" class="form-select">
                <option value="square">Carré / Rectangle</option>
                <option value="contour">Découpe à la forme</option>
                <option value="kiss_cut">Kiss-cut</option>
              </select>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Notes internes</label>
            <textarea name="notes" class="form-control" rows="3" placeholder="Remarques, instructions spéciales..."></textarea>
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4">
              <i class="bi bi-check-lg me-1"></i>Créer la commande
            </button>
            <a href="/" class="btn btn-outline-secondary">Annuler</a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
